/* MULTI-PANEL WORKS: use panels instead of image/imageLink. Each panel:
{ "id": "B", "image": "https://...", "imageLink": "https://...", "alt": "Panel B" }.
The array order specifies documented display order. panelLayout: auto, two, three, four.
Two: side by side; three: first panel centered above the other two;
four: 2x2. E.g. B/A/C: panels [B,A,C], layout three.
Physical arrangements override defaults; 5+ panels require owner review.

RELATED WORKS: for artworks used in creation, use relatedWorks.usedInCreation.
Heading appears ONCE: "Used in the Creation of This Painting".
Each item has a clickable image, title inside its own subtle card,
and optional caption for meaningful notes. No secondary repeated note.
Other relationship groups remain available when accurate.

/* OPTIONAL CARD FORMAT (add inside the appropriate [ ] array):
{ "title": "Optional caption title", "caption": "Optional second line",
  "image": "https://.../image.jpg", "url": "https://.../detail.html" }
For IMAGE ONLY (no caption), set title and caption to empty strings.
For unlinked images, leave url empty. No empty caption band is shown.
For literary/exhibition records, use a text string or an object
{ "text": "Description", "url": "https://..." }.
The text field is plain text; italics can be specified using a simple
em tag only in exhibition/literature lines for already documented titles.
*/

(function () {
'use strict';
const d=paintingData;
const el=(tag, cls, txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined&&txt!==null)x.textContent=String(txt);return x;};
const app=document.getElementById('catalogue-content');
const external=(a,url)=>{a.href=url;a.target='_blank';a.rel='noopener noreferrer';};
const section=(id,title)=>{const s=el('section','panel');s.id=id;s.append(el('h2','',title));app.append(s);return s;};
const valuePresent=x=>x!==null&&x!==undefined&&String(x).trim()!=='';
const list=(id,title,entries)=>{
 if(!Array.isArray(entries)||!entries.length)return;
 const s=section(id,title),ul=el('ul','simplelist');
 entries.forEach(entry=>{
  const li=el('li');
  if(typeof entry==='string'){
    // Existing title italics in catalogue bibliography are preserved.
    // Only trusted author-provided archive data should go here.
    li.innerHTML=entry;
  } else if(entry&&valuePresent(entry.text)){
    li.textContent=entry.text;
    if(entry.url){const a=el('a','',' Source');external(a,entry.url);li.append(a);}
  } else return;
  ul.append(li);
 });
 if(ul.children.length)s.append(ul);else s.remove();
};
function cards(where,arr,small,layoutClass){
 if(!Array.isArray(arr)||!arr.length)return false;
 const grid=el('div',layoutClass||(small?'grid6':'grid4'));let count=0;
 for(const c of arr){
  if(!c||!c.image)continue;
  const outer=el('figure','tile');outer.style.margin='0';
  const imageHref=c.imageUrl||c.imageLink||c.image;
  const imageA=el('a','tileimg');external(imageA,imageHref);
  const img=el('img');img.loading='lazy';img.src=c.image;img.alt=c.alt||c.title||'Documentary image';imageA.append(img);outer.append(imageA);
  if(valuePresent(c.title)||valuePresent(c.caption)||valuePresent(c.sourceLabel)||valuePresent(c.sourceUrl)){
   const label=el('figcaption','tilecaption');
   if(valuePresent(c.title)){
    const nm=el('span','tilename');
    if(valuePresent(c.url)){const link=el('a','',c.title);external(link,c.url);nm.append(link);}else nm.textContent=c.title;
    label.append(nm);
   }
   if(valuePresent(c.caption))label.append(el('span','tilesub',c.caption));
   if(valuePresent(c.sourceLabel)||valuePresent(c.sourceUrl)){
    const source=el('span','card-source');
    if(valuePresent(c.sourceUrl)){const a=el('a','',c.sourceLabel||'Source');external(a,c.sourceUrl);source.append(a);}
    else source.textContent=c.sourceLabel;
    label.append(source);
   }
   outer.append(label);
  }
  grid.append(outer);count++;
 }
 if(count){where.append(grid);return true;}return false;
}
function cardSection(id,title,items,small=false){
 if(!Array.isArray(items)||!items.some(x=>x&&x.image))return;
 const s=section(id,title);const cls=(id==='cultural-references'?(items.filter(x=>x&&x.image).length>=4?'grid6 cultural-compact':'grid4 cultural-large'):null);if(!cards(s,items,small,cls))s.remove();
}
const hero=el('section','hero');hero.id='artwork';hero.append(el('h1','',d.title||'Untitled'));
const panels=Array.isArray(d.panels)?d.panels.filter(p=>p&&p.image):[];
if(panels.length){
 const count=panels.length;
 if(count>4)throw new Error('Five or more panels require documented arrangement review.');
 const expected={2:'two',3:'three',4:'four'};
 if(!expected[count])throw new Error('Single-panel works must use image/imageLink.');
 const layout=d.panelLayout==='auto'?expected[count]:d.panelLayout;
 if(layout!==expected[count])throw new Error('Panel count and layout do not match.');
 const gallery=el('div','panel-artworks '+layout);
 panels.forEach((p,i)=>{
  const holder=el(p.imageLink?'a':'div','painting-mat');if(p.imageLink)external(holder,p.imageLink);
  const img=el('img','mainpainting');img.src=p.image;img.alt=p.alt||('Panel '+(p.id||String(i+1)));
  holder.append(img);gallery.append(holder);
 });hero.append(gallery);
}else if(d.image){const holder=el(d.imageLink?'a':'div');if(d.imageLink)external(holder,d.imageLink);
 const img=el('img','mainpainting');img.src=d.image;img.alt=d.title||'Painting';holder.className='painting-mat';holder.append(img);hero.append(holder);}
const meta=el('div','metadata');
for(const [label,value] of Object.entries(d.metadata||{})){
 if(!valuePresent(value))continue;
 const r=el('div','metaitem'),b=el('strong','',label+':');r.append(b,document.createTextNode(' '+value));meta.append(r);
}
hero.append(meta);app.append(hero);
list('exhibitions','Exhibitions',d.exhibitions);
list('literature','Literature',d.literature);
list('notes','Notes',d.notes);
cardSection('work-in-progress','Work in Progress',d.workInProgress);
cardSection('photo-gallery','Photo Gallery',d.photoGallery);
cardSection('reference-materials','Reference Materials',d.referenceMaterials);
const groups=[['Used in the Creation of This Painting',d.relatedWorks?.usedInCreation],['Earlier Paintings Incorporated into This Painting',d.relatedWorks?.earlierPaintingsIncorporated],['Related Paintings',d.relatedWorks?.paintings],['Related Drawings & Sketches',d.relatedWorks?.drawings],['Artist-Created Graphic Designs',d.relatedWorks?.graphicDesigns],['Other Related Works',d.relatedWorks?.other]];
if(groups.some(([_,a])=>Array.isArray(a)&&a.some(x=>x&&x.image))){
 const s=section('related-works','Related Works by Ron English');
 for(const [title,entries] of groups){if(!Array.isArray(entries)||!entries.some(x=>x&&x.image))continue;
 const div=el('div','subsection');div.append(el('h3','',title));cards(div,entries,false,'related-gallery');s.append(div);}
}
cardSection('artist-created-graphic-designs','Artist-Created Graphic Designs',d.artistCreatedGraphicDesigns);
cardSection('cultural-references','Cultural & Artistic References',d.culturalReferences,true);
// Preserve documented legacy sections that are not represented by structured arrays.
// Their original markup (including images, captions and links) is retained verbatim.
if(Array.isArray(d.preservedSections)){
 for(const item of d.preservedSections){
  if(!item||!valuePresent(item.title)||!valuePresent(item.content))continue;
  const role=valuePresent(item.role)?String(item.role):'';
  const isCultural=role==='cultural-artistic-references';
  if(isCultural&&Array.isArray(d.culturalReferences)&&d.culturalReferences.some(x=>x&&x.image)){
   throw new Error('Duplicate cultural reference sources: review this painting before rendering.');
  }
  const existing=[...app.querySelectorAll('section.panel')].some(x=>x.dataset.role===role&&role!=='');
  if(existing)throw new Error('Duplicate documentary section role: '+role);
  const preserved=section('preserved-'+(role||'documentation'),String(item.title));
  if(role)preserved.dataset.role=role;
  preserved.classList.add('preserved-documentary');
  const content=el('div','preserved-documentary-content');
  content.innerHTML=String(item.content);
  const figureCount=content.querySelectorAll('figure').length;
  if(Number.isInteger(item.count)&&item.count!==figureCount){
   throw new Error('Preserved documentary figure count mismatch: '+item.title);
  }
  preserved.append(content);
 }
}
if(Array.isArray(d.videos)&&d.videos.length){
 const verified=d.videos.filter(v=>v&&v.url&&v.image);
 if(verified.length){const vs=section('videos','Videos'),gallery=el('div','video-gallery');
  for(const v of verified){const fig=el('figure','video-tile'),a=el('a','video-poster');fig.style.margin='0';external(a,v.url);
   a.setAttribute('aria-label','Watch video on YouTube');const img=el('img');img.src=v.image;img.alt=v.alt||'Video thumbnail';a.append(img,el('span','video-play','▶'));a.lastChild.setAttribute('aria-hidden','true');
   fig.append(a);const caption=el('figcaption'),link=el('a','',v.caption||'Watch on YouTube');external(link,v.url);caption.append(link);fig.append(caption);gallery.append(fig);
  }vs.append(gallery);
 }
}
const seq=document.getElementById('previous-next');
for(const item of [d.previous,d.next])if(item&&item.url){const a=el('a','pill',item.label||'View painting');a.href=item.url;seq.append(a);}
})();</script></body></html>
